org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.overridePathCheck=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# Windows uses the workspace's ASCII SUBST path for Gradle while editors retain D:\ paths.
# Mixing those roots corrupts Kotlin incremental caches, so canonical builds are non-incremental.
kotlin.incremental=false
