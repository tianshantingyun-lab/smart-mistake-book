[versions]
agp = "9.3.0"
kotlin = "2.3.21"
compose-bom = "2026.06.00"
core-ktx = "1.18.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.9.8"
datastore = "1.2.1"
coroutines = "1.11.0"
serialization = "1.9.0"
room3 = "3.0.0"
paging = "3.4.2"
sqlite = "2.7.0"
# Stage-1 词面检索实验台（WP-C）：JVM 侧跑真 SQLite FTS5 + bm25() 的**测试**依赖。
# 版本取自 Maven Central 的 maven-metadata.xml（`<release>` = 3.53.4.0，2026-08-26 发布）。
sqlite-jdbc = "3.53.4.0"
ksp = "2.3.10"
kover = "0.9.1"
benchmark = "1.4.0"
baselineprofile = "1.5.0-rc01"
uiautomator = "2.3.0"
profileinstaller = "1.4.0"
junit = "4.13.2"
androidx-junit = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
exifinterface = "1.4.1"
mlkit-text-recognition = "16.0.1"
# Stage-3 端侧稠密腿运行时（LiteRT）。钉 2.1.6：本模块 minSdk=23，而 2.2.0 的
# `uses-sdk minSdkVersion=24` 会被 manifest 合并直接拒绝（本轮实测 AAR 字节）。
litert = "2.1.6"
# `litert-api:2.1.6` 的 POM 传递依赖。litert-api 与 litert 共用同一个 namespace
# `com.google.ai.edge.litert`，AGP 9 的 app manifest 合并判其为错误（库 namespace 必须唯一），
# 所以 core:data 把 litert-api 从 Android 依赖图里摘出来、改走构建期派生的本地 AAR
# （只改清单 namespace，其余逐字节保留）。摘出来之后这四条传递依赖要显式补回，
# classpath 才与上游 POM 等价——版本号与 POM 一字不差。
litert-api-lifecycle-runtime = "2.10.0"
litert-api-guava = "33.5.0-android"
litert-api-coroutines-guava = "1.8.0"
litert-api-play-delivery = "0.1.1-alpha01"
desugar-jdk-libs = "2.0.3"
okhttp = "5.4.0"
work = "2.10.5"
filament = "1.71.5"
vico = "3.3.0"
richtext = "0.17.0"

