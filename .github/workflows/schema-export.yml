name: schema-export

# TEMPORARY one-shot workflow (task #39, cluster A): the committed
# core/database/schemas/34.json identityHash lags the current entities
# because the schema was never re-exported after later entity changes.
# Room's KSP exportSchema writes the JSON into schemaDirectory during
# kspDebugKotlin; this workflow runs that on CI and pushes the result.
# Delete this file once the schema is realigned.

on:
  push:
    paths:
      - ".github/workflows/schema-export.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew
      - name: Temporarily pass explicit room.internal schema dirs
        run: |
          python3 - <<'PYEOF'
          p = "core/database/build.gradle.kts"
          text = open(p, encoding="utf-8").read()
          text += '''
          // TEMPORARY (task #39): the room3 plugin wiring produced no schema files
          // (copyRoomSchemas NO-SOURCE); pass the internal dirs explicitly.
          ksp {
              arg("room.internal.schemaOutput", layout.buildDirectory.dir("intermediates/room/schemas/kspDebugKotlin").get().asFile.absolutePath)
              arg("room.internal.schemaInput", projectDir.resolve("schemas").absolutePath)
          }
          '''
          open(p, "w", encoding="utf-8").write(text)
          print(open(p, encoding="utf-8").read())
          PYEOF
      - name: Run Room schema export (KSP)
        run: ./gradlew :core:database:kspDebugKotlin :core:database:copyRoomSchemas --console=plain
      - name: Diagnose schema export
        run: |
          echo "--- exported identityHash:"
          grep -o '"identityHash": "[a-f0-9]*"' \
            "core/database/schemas/com.tingyun.smartmistakebook.core.database.StudyDatabase/34.json" || true
          echo "--- json files produced under build:"
          find core/database/build -name '*.json' -print | head -n 40 || true
          echo "--- schema dir status:"
          git status --porcelain -- core/database/schemas || true
      - name: Commit schema changes if any
        run: |
          if [ -n "$(git status --porcelain -- core/database/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add core/database/schemas
            git commit -m "重新导出 Room schema 对齐实体"
            git push
          else
            echo "no schema changes"
          fi
