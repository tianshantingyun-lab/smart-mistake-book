name: android-check

on:
  pull_request:
    paths:
      - "**.kt"
      - "**.kts"
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      # Gate scripts themselves: without this a PR that only edits a checker
      # would not run the workflow that executes it.
      - "tools/**"
      # 知识库内容目录（显式列出：knowledge/** 供将来顶层 knowledge/ 使用，
      # resources/knowledge/** 被 core/** 覆盖，写全防止"路径改了触发就失效"）
      - "knowledge/**"
      - "core/data/src/main/resources/knowledge/**"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The generated status report is pushed back to the branch on main
    # pushes; the default GITHUB_TOKEN is read-only, so grant
    # contents:write to this job only.
    permissions:
      contents: write
    # 单测 + 多次 assemble + lint 串行执行，预防性放宽到 60 分钟。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # 2026-09-17：新版 GitHub runner 移除了 tools 包，setup-android@v3 强下
      # cmdline-tools 后 sdkmanager exit 1（run 35244477722 / 35244418029 /
      # 35244418845，Node 20 回退无效）。官方 v4.0.2 当日发布修复（"Fix for
      # removed tools package"），升级到 v4。
      - uses: android-actions/setup-android@v4
      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew
      # 知识库构建侧：30+ 手术工具 + 22 道质量门 + 五张权威表一致性 + roundtrip。
      # 纯 stdlib Python，不需要 Android 工具链；放在 Gradle 步骤前，让"门红"
      # 在几分钟内可见而不是等完整构建。CI 无 staging（build/ 不入版本控制），
      # run_kb_checks 自动回退到成品目录校验。
      - name: Knowledge build toolchain tests
        run: python3 -m unittest discover -s tools/tests -t tools
      - name: Knowledge pack gate and table-pack consistency
        run: python3 tools/ci/run_kb_checks.py
      - name: Room schema drift check
        run: git diff --exit-code -- core/database/schemas
      - name: Unit tests
        # The flavor-named tasks only exist in :app; every other module's
        # unit tests are listed explicitly or they never run in CI. Pure-JVM
        # modules use `test`; Android library modules use the debug variant.
        run: >
          ./gradlew testLocalFirstDebugUnitTest testStrictOfflineDebugUnitTest
          :core:domain:test :core:model:test :core:visual-runtime:test
          :quality:visual-benchmark:test
          :core:data:testDebugUnitTest :core:database:testDebugUnitTest
          :core:export:testDebugUnitTest :core:visual-ui:testDebugUnitTest
          :feature:capture:testDebugUnitTest :feature:library:testDebugUnitTest
          :feature:tutor:testDebugUnitTest :feature:profile:testDebugUnitTest
          :feature:review:testDebugUnitTest --console=plain
      - name: Assemble local first debug
        run: ./gradlew :app:assembleLocalFirstDebug --console=plain
      - name: Assemble strict offline debug
        run: ./gradlew :app:assembleStrictOfflineDebug --console=plain
      - name: Assemble release dry run
        run: |
          keytool -genkeypair -v -keystore ci-release-dry-run.keystore \
            -alias ci-dry-run -keyalg RSA -keysize 2048 -validity 365 \
            -storepass ci-dry-run-pass -keypass ci-dry-run-pass \
            -dname "CN=CI Dry Run, OU=CI, O=Lab, L=NA, S=NA, C=US"
          RELEASE_STORE_FILE="$PWD/ci-release-dry-run.keystore" \
          RELEASE_STORE_PASSWORD=ci-dry-run-pass \
          RELEASE_KEY_ALIAS=ci-dry-run \
          RELEASE_KEY_PASSWORD=ci-dry-run-pass \
          ./gradlew :app:assembleLocalFirstRelease :app:assembleStrictOfflineRelease \
            :app:bundleLocalFirstRelease :app:bundleStrictOfflineRelease --console=plain
      - name: Release manifest gate (no debug-only component, no over-broad FileProvider path)
        run: python3 tools/ci/check_release_manifest.py
      - name: Compile macrobenchmark and baseline profile module
        run: ./gradlew :benchmark:assemble --console=plain
      - name: Lint
        # App flavors plus every Android library module. `lint<Flavor>Debug`
        # only matches :app (it is the only module with product flavors), so the
        # libraries used to be linted nowhere: their NewApi/RestrictedApi
        # findings accumulated unseen until a manual run surfaced them (KD-11,
        # KD-12). List the modules explicitly — same reason the unit-test step
        # lists them: a module that is not named is never checked.
        run: >
          ./gradlew lintLocalFirstDebug lintStrictOfflineDebug
          :core:data:lintDebug :core:database:lintDebug :core:export:lintDebug
          :core:ui:lintDebug :core:visual-ui:lintDebug
          :feature:capture:lintDebug :feature:library:lintDebug
          :feature:profile:lintDebug :feature:review:lintDebug
          :feature:tutor:lintDebug
          --console=plain
      - name: Unit-test coverage reports (feed the status report)
        # JVM modules use Kover; Android libraries use the AGP+Jacoco report
        # because Kover 0.9.1 cannot see AGP 9's built-in-Kotlin variants (KD-5).
        run: >
          ./gradlew :core:domain:koverXmlReport
          :core:data:unitTestCoverageXmlReport :core:database:unitTestCoverageXmlReport
          --console=plain
      - name: File-size gate
        # Baseline-aware: only files changed on this branch (vs origin/main) are
        # checked, so the existing large-file backlog (already >600 lines) does
        # not fail every run. The hard line (main 1000 / test 1500) blocks a
        # newly introduced megafile. Push to main has no diff against itself and
        # is skipped transparently.
        run: python3 tools/ci/check_file_size_gate.py
      - name: Room schema drift recheck
        run: git diff --exit-code -- core/database/schemas
      - name: Generate machine-verifiable status report
        if: always()
        run: python3 tools/ci/generate_status.py
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          TRIGGERED_BY: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
      - name: Upload status report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-report
          path: docs/status.md
      - name: Commit status report (main pushes only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/status.md
          git diff --cached --quiet || git commit -m "ci: update generated status report for ${GITHUB_SHA}"
          git push

  instrumented:
    runs-on: ubuntu-latest
    # 模拟器启动最长可占约 30 分钟（boot timeout 1800s），再加 9 个 connected 测试任务，
    # 60 分钟余量不足，放宽到 90 分钟。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # 2026-09-17：新版 GitHub runner 移除了 tools 包，setup-android@v3 强下
      # cmdline-tools 后 sdkmanager exit 1（run 35244477722 / 35247418029 /
      # 35248118845，Node 20 回退无效）。官方 v4.0.2 当日发布修复（"Fix for
      # removed tools package"），升级到 v4。
      - uses: android-actions/setup-android@v4
      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew
      # CI run 32662033881：模拟器以 -accel off 软件模拟冷启动耗时 1023 秒，
      # 测试调度阶段 9 次 ShellCommandUnresponsiveException、API Level 探测失败，
      # 0 条测试执行。GitHub ubuntu-latest 支持 KVM，按官方推荐先授权 /dev/kvm，
      # 让 emulator-runner（disable-linux-hw-accel 默认 auto）自动启用硬件加速。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # CI run 32659221749：模拟器实际 913 秒才启动完成，却被 900 秒阈值判死；
          # 放宽到 1800 秒，避免把慢启动误判为失败。启用 KVM 后启动应显著加快，
          # 保留宽阈值仅作为兜底。
          emulator-boot-timeout: 1800
          # 不显式传 -accel off / -no-snapshot：默认 emulator-options
          # (-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim)
          # 已满足无头 CI 需求，硬件加速由 action 依据 KVM 可用性自动决定。
          # emulator-runner runs each non-empty `script` line in its own
          # `sh -c` (its parseScript splits on newlines), so backslash line
          # continuations do NOT work - the trailing backslash is passed to
          # Gradle as a literal task name. Keep gradle on a single line.
          script: |
            ./gradlew :core:database:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest :core:visual-ui:connectedDebugAndroidTest :core:export:connectedDebugAndroidTest :feature:capture:connectedDebugAndroidTest :feature:tutor:connectedDebugAndroidTest :feature:library:connectedDebugAndroidTest :app:connectedLocalFirstDebugAndroidTest :app:connectedStrictOfflineDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.ciSlowRunner=1 --continue --console=plain
      - name: Fail if any benchmark/beta gate is hardcoded (moved to targets)
        run: |
          if rg -q "assertTrue.*1500L|return 1500L|0.5 // Placeholder|dataRecoveryDrillGate" benchmark app; then
            echo "Hardcoded performance/beta data must not exist; use PerformanceTargets/BetaGateTargets with NOT_MEASURED."
            exit 1
          fi
